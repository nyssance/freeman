name: Gates

# Throughput: the head build must reach 90% of the base build on the same runner.
# Memory: resident memory must stop growing under a mixed load.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Throughput and memory
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install bombardier
        run: go install github.com/codesenberg/bombardier@latest

      - name: Build the base revision and record its throughput
        if: github.event_name == 'pull_request'
        run: |
          git worktree add ../base ${{ github.event.pull_request.base.sha }}
          cp scripts/gate.py ../base/scripts/gate.py
          cd ../base
          uv sync --python 3.15
          uv run maturin develop --release
          uv run python scripts/gate.py perf --record
          cp .gate-baseline.json "$GITHUB_WORKSPACE/.gate-baseline.json"

      - name: Build the head revision
        run: |
          uv sync --python 3.15
          uv run maturin develop --release

      - name: Throughput gate
        if: github.event_name == 'pull_request'
        run: uv run python scripts/gate.py perf

      - name: Memory gate
        run: uv run python scripts/gate.py memory
